title: Zhang Hanbo's homepage.
description: >- # this means to ignore newlines until "baseurl:"
  Zhang Hanbo's homepage.
baseurl: "" # the subpath of the site
url: "https://zhanghanbo.github.io" # the base hostname & protocol for the site
og_image: /assets/img/profile-pic.jpeg

header:
  pages:
    - name: About
      slug: /
    - name: Publication
    - name: Research
    - name: CV
    - name: Blog

footer:
  show_powered_by: true
  contact:
    - name: Email
      value: zhanghanbo163@gmail.com
      link: mailto:zhanghanbo163@gmail.com
#    - name: WeChat
#      value: YourWeChatUsername
#      link: "#"
  follow:
#    - name: Twitter
#      link: http://twitter.com/YourTwitterUsername
#      username: "@YourTwitterUsername"
#    - name: Facebook
